services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Set to "false" to reuse a locally-built frontend/dist instead of
        # running npm inside the container (useful behind a restricted
        # network). Run `npm --prefix frontend run build` first.
        BUILD_FRONTEND: ${BUILD_FRONTEND:-true}
    image: kd-payment-system:latest
    container_name: kd-payment-system
    ports:
      - "3600:3600"
    environment:
      ADDR: ":3600"
    restart: unless-stopped
